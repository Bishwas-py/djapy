name: Release to PyPI

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating tags and the version bump commit
      id-token: write  # for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Determine version bump from commits since last release
        id: version
        run: |
          # A regular "Merge pull request" merge commit never matches a
          # Conventional Commit prefix, so scan every commit since the last
          # release tag (not just HEAD) and pick the highest-priority bump.
          # If no release tag exists yet, do nothing: push a baseline tag
          # (e.g. v0.3.1) first so the scan range stays meaningful.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tag found, skipping (push a baseline vX.Y.Z tag first)"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_MSGS=$(git log "$LATEST_TAG..HEAD" --pretty=%s --no-merges)

          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # Strip any pre-release suffix (e.g. 0.3.1.dev1 -> 0.3.1) so the
          # arithmetic below always works on plain MAJOR.MINOR.PATCH.
          BASE=$(echo "$CURRENT" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if echo "$COMMIT_MSGS" | grep -qiE '^feat(\(.+\))?!:|^BREAKING'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP="major"
          elif echo "$COMMIT_MSGS" | grep -qiE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP="minor"
          elif echo "$COMMIT_MSGS" | grep -qiE '^(fix|perf|refactor)(\(.+\))?:'; then
            PATCH=$((PATCH + 1))
            BUMP="patch"
          else
            echo "No version bump needed (range: $LATEST_TAG..HEAD)"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW_VERSION ($BUMP), scanned range $LATEST_TAG..HEAD"

      - name: Update version in pyproject.toml
        if: steps.version.outputs.bump != 'none'
        run: |
          sed -i "s/^version = \"${{ steps.version.outputs.current }}\"/version = \"${{ steps.version.outputs.new }}\"/" pyproject.toml

      - name: Build package
        if: steps.version.outputs.bump != 'none'
        run: uv build

      - name: Publish to PyPI
        if: steps.version.outputs.bump != 'none'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Tag and push version
        if: steps.version.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main --tags
